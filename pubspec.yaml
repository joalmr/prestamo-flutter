name: prestamo
description: A new Flutter project.
publish_to: "none"
version: 0.1.3+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  easy_mask: ^2.0.1
  easy_rich_text: ^2.2.0
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.1
  google_mobile_ads: ^9.1.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
